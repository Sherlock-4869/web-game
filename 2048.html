<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2048 · 幻彩版 — 像素游乐场</title>
  <link rel="stylesheet" href="assets/arcade-shell.css">
  <script src="assets/arcade-sfx.js"></script>
  <style>
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      position: relative;
      overflow: visible;
    }

    .score-float-host {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    .score-float {
      position: absolute;
      left: 50%;
      top: 2px;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 15px;
      color: #6ef7ff;
      text-shadow: 0 2px 10px rgba(92, 225, 230, 0.65);
      white-space: nowrap;
      animation: floatUpScore 720ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUpScore {
      0% { opacity: 0; transform: translate(-50%, 8px) scale(0.85); }
      20% { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -32px) scale(0.96); }
    }

    .stage-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .board-frame {
      position: relative;
      width: min(100%, 456px);
      aspect-ratio: 1 / 1;
      padding: 12px;
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(8, 16, 32, 0.95), rgba(14, 26, 48, 0.92));
      border: 1px solid rgba(110, 195, 255, 0.24);
      box-shadow:
        inset 0 2px 12px rgba(0, 0, 0, 0.55),
        0 20px 50px rgba(0, 0, 0, 0.42);
      touch-action: none;
      user-select: none;
      overflow: hidden;
      transition: background 0.28s ease, border-color 0.28s ease;
    }

    .board-frame[data-size="5"] {
      padding: 10px;
    }

    /* Classic Warm Board Theme */
    .board-frame[data-theme="warm"] {
      background: linear-gradient(160deg, #5d4f43, #4a3e35);
      border-color: rgba(255, 214, 165, 0.32);
      box-shadow:
        inset 0 2px 10px rgba(25, 16, 10, 0.45),
        0 20px 46px rgba(0, 0, 0, 0.42);
    }

    .board-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .bg-grid {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(var(--grid-n, 4), 1fr);
      grid-template-rows: repeat(var(--grid-n, 4), 1fr);
      gap: var(--grid-gap, 10px);
    }

    .bg-cell {
      border-radius: var(--cell-radius, 12px);
      background: rgba(26, 46, 78, 0.48);
      border: 1px solid rgba(120, 175, 255, 0.09);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28);
      transition: background 0.25s ease;
    }

    .board-frame[data-theme="warm"] .bg-cell {
      background: rgba(238, 228, 218, 0.18);
      border-color: rgba(255, 240, 220, 0.08);
      box-shadow: inset 0 2px 4px rgba(35, 22, 12, 0.22);
    }

    .tile-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tile-el {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      transition: transform 130ms cubic-bezier(.2, .8, .2, 1);
      z-index: 2;
    }

    .tile-el.is-merged-host {
      z-index: 4;
    }

    .tile-el.is-dying {
      z-index: 1;
    }

    .board-frame.no-anim .tile-el {
      transition: none !important;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      border-radius: var(--cell-radius, 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      border: 1px solid transparent;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
      transition: background 0.22s ease, color 0.22s ease, box-shadow 0.22s ease;
    }

    .tile-inner.anim-new {
      animation: tilePopIn 180ms cubic-bezier(0.2, 0.9, 0.3, 1.15) 55ms backwards;
    }

    .tile-inner.anim-merge {
      animation: tileMergeBounce 220ms cubic-bezier(0.22, 1, 0.36, 1) 70ms backwards;
    }

    @keyframes tilePopIn {
      0% { opacity: 0; transform: scale(0.35); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes tileMergeBounce {
      0% { opacity: 0; transform: scale(0.72); }
      55% { opacity: 1; transform: scale(1.16); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ================= DARK NEON PALETTE ================= */
    .board-frame[data-theme="neon"] .t-2 {
      background: linear-gradient(145deg, #162c4e, #10203a);
      color: #cfe6ff;
      border-color: rgba(120, 185, 255, 0.32);
    }
    .board-frame[data-theme="neon"] .t-4 {
      background: linear-gradient(145deg, #173d5c, #112d46);
      color: #7ef3ff;
      border-color: rgba(92, 225, 230, 0.45);
    }
    .board-frame[data-theme="neon"] .t-8 {
      background: linear-gradient(145deg, #0d6e8a, #094e68);
      color: #ecfeff;
      border-color: rgba(103, 232, 249, 0.58);
      box-shadow: 0 6px 18px rgba(6, 182, 212, 0.28);
    }
    .board-frame[data-theme="neon"] .t-16 {
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-color: rgba(147, 197, 253, 0.6);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.36);
    }
    .board-frame[data-theme="neon"] .t-32 {
      background: linear-gradient(145deg, #7c3aed, #5b21b6);
      color: #f5f3ff;
      border-color: rgba(196, 181, 253, 0.62);
      box-shadow: 0 6px 22px rgba(124, 58, 237, 0.38);
    }
    .board-frame[data-theme="neon"] .t-64 {
      background: linear-gradient(145deg, #db2777, #9d174d);
      color: #fff1f2;
      border-color: rgba(251, 113, 133, 0.68);
      box-shadow: 0 8px 24px rgba(219, 39, 119, 0.42);
    }
    .board-frame[data-theme="neon"] .t-128 {
      background: linear-gradient(145deg, #ea580c, #c2410c);
      color: #fff7ed;
      border-color: rgba(253, 186, 116, 0.68);
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.42);
    }
    .board-frame[data-theme="neon"] .t-256 {
      background: linear-gradient(145deg, #d97706, #b45309);
      color: #fefce8;
      border-color: rgba(253, 224, 71, 0.72);
      box-shadow: 0 8px 26px rgba(245, 158, 11, 0.46);
    }
    .board-frame[data-theme="neon"] .t-512 {
      background: linear-gradient(145deg, #059669, #047857);
      color: #ecfdf5;
      border-color: rgba(110, 231, 183, 0.75);
      box-shadow: 0 8px 26px rgba(16, 185, 129, 0.46);
    }
    .board-frame[data-theme="neon"] .t-1024 {
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      color: #ffffff;
      border-color: rgba(165, 243, 252, 0.85);
      box-shadow: 0 0 26px rgba(99, 102, 241, 0.58);
    }
    .board-frame[data-theme="neon"] .t-2048 {
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
      color: #ffffff;
      border-color: #fde68a;
      box-shadow: 0 0 32px rgba(236, 72, 153, 0.68), inset 0 0 12px rgba(255, 255, 255, 0.35);
    }
    .board-frame[data-theme="neon"] .t-super {
      background: linear-gradient(135deg, #14b8a6, #3b82f6, #d946ef);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 36px rgba(92, 225, 230, 0.78);
    }

    /* ================= CLASSIC WARM PALETTE ================= */
    .board-frame[data-theme="warm"] .t-2 {
      background: #eee4da;
      color: #5c5248;
      border-color: rgba(255, 255, 255, 0.5);
    }
    .board-frame[data-theme="warm"] .t-4 {
      background: #ede0c8;
      color: #5c5248;
      border-color: rgba(255, 255, 255, 0.5);
    }
    .board-frame[data-theme="warm"] .t-8 {
      background: #f2b179;
      color: #f9f6f2;
    }
    .board-frame[data-theme="warm"] .t-16 {
      background: #f59563;
      color: #f9f6f2;
    }
    .board-frame[data-theme="warm"] .t-32 {
      background: #f67c5f;
      color: #f9f6f2;
    }
    .board-frame[data-theme="warm"] .t-64 {
      background: #f65e3b;
      color: #f9f6f2;
      box-shadow: 0 6px 16px rgba(246, 94, 59, 0.35);
    }
    .board-frame[data-theme="warm"] .t-128 {
      background: #edcf72;
      color: #f9f6f2;
      box-shadow: 0 6px 18px rgba(243, 215, 116, 0.35);
    }
    .board-frame[data-theme="warm"] .t-256 {
      background: #edcc61;
      color: #f9f6f2;
      box-shadow: 0 6px 20px rgba(243, 215, 116, 0.42);
    }
    .board-frame[data-theme="warm"] .t-512 {
      background: #edc850;
      color: #f9f6f2;
      box-shadow: 0 8px 22px rgba(243, 215, 116, 0.48);
    }
    .board-frame[data-theme="warm"] .t-1024 {
      background: #edc53f;
      color: #ffffff;
      box-shadow: 0 8px 26px rgba(243, 215, 116, 0.58);
    }
    .board-frame[data-theme="warm"] .t-2048 {
      background: linear-gradient(135deg, #edc22e, #f59e0b);
      color: #ffffff;
      border-color: #fef08a;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.72);
    }
    .board-frame[data-theme="warm"] .t-super {
      background: linear-gradient(135deg, #292524, #1c1917);
      color: #fde68a;
      border-color: #fbbf24;
      box-shadow: 0 0 28px rgba(251, 191, 36, 0.55);
    }

    .btn[disabled] {
      opacity: 0.45;
      pointer-events: none;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 6px;
    }

    @media (max-width: 560px) {
      .toolbar-row {
        justify-content: center;
      }
      .board-frame {
        padding: 9px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="arcade-page">
    <header class="arcade-topbar">
      <a class="arcade-brand" href="index.html">
        <span class="arcade-brand-mark">🎮</span>
        <span>像素游乐场</span>
      </a>
      <div class="arcade-nav-actions">
        <button class="btn btn-ghost btn-sm" id="muteBtn" type="button">🔊 音效</button>
        <a class="btn btn-ghost btn-sm" href="index.html">← 返回大厅</a>
      </div>
    </header>

    <main class="game-shell">
      <div class="game-header">
        <div class="game-title-group">
          <div class="game-icon">🔢</div>
          <div>
            <h1>2048 · 幻彩版</h1>
            <p class="game-subtitle">丝滑滑动合成数字，冲击 2048 与更高幻彩阶梯</p>
          </div>
        </div>
        <div class="stat-strip">
          <div class="stat-pill" id="scorePill">
            <span class="label">当前得分</span>
            <span class="value" id="scoreVal">0</span>
            <div class="score-float-host" id="scoreFloatHost"></div>
          </div>
          <div class="stat-pill amber">
            <span class="label">历史最高</span>
            <span class="value" id="bestVal">0</span>
          </div>
          <div class="stat-pill emerald">
            <span class="label">最大方块</span>
            <span class="value" id="maxTileVal">2</span>
          </div>
        </div>
      </div>

      <div class="toolbar-row">
        <div class="toolbar-group">
          <div class="seg-group" id="sizeGroup" role="tablist" aria-label="棋盘规格">
            <button class="seg-btn active" type="button" data-size="4">4×4 经典</button>
            <button class="seg-btn" type="button" data-size="5">5×5 进阶</button>
          </div>
          <div class="seg-group" id="themeGroup" role="tablist" aria-label="视觉主题">
            <button class="seg-btn active" type="button" data-theme="neon">极夜霓虹</button>
            <button class="seg-btn" type="button" data-theme="warm">暖阳原版</button>
          </div>
        </div>

        <div class="toolbar-group">
          <button class="btn btn-sm" id="undoBtn" type="button" disabled>↩ 撤销一步 (0)</button>
          <button class="btn btn-primary btn-sm" id="newGameBtn" type="button">↻ 新游戏</button>
        </div>
      </div>

      <div class="stage-center">
        <div class="board-frame" id="boardFrame" data-theme="neon" data-size="4">
          <div class="board-inner" id="boardInner">
            <div class="bg-grid" id="bgGrid"></div>
            <div class="tile-layer" id="tileLayer"></div>
          </div>

          <!-- Victory Overlay -->
          <div class="modal-overlay hidden" id="winOverlay">
            <span class="modal-badge">✨ 2048 UNLOCKED</span>
            <h2>幻彩 2048 达成！</h2>
            <p id="winSummary">你已成功合成 2048 方块！要继续冲击 4096 传奇纪录吗？</p>
            <div class="modal-actions">
              <button class="btn btn-primary" id="keepPlayingBtn" type="button">继续挑战 4096</button>
              <button class="btn" id="winRestartBtn" type="button">重新开始</button>
            </div>
          </div>

          <!-- Game Over Overlay -->
          <div class="modal-overlay hidden" id="overOverlay">
            <span class="modal-badge" style="color:var(--rose);border-color:rgba(251,113,133,0.4);background:rgba(251,113,133,0.14)">GAME OVER</span>
            <h2>棋盘已满</h2>
            <p id="overSummary">本局最终得分 0</p>
            <div class="modal-actions">
              <button class="btn" id="overUndoBtn" type="button">↩ 撤销一步</button>
              <button class="btn btn-primary" id="overRestartBtn" type="button">再来一局</button>
            </div>
          </div>
        </div>

        <div class="kbd-hints">
          <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 滑动合成</span>
          <span><kbd>Z</kbd> 撤销一步</span>
          <span>支持触屏手势滑动</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      ArcadeSFX.recordPlay('2048.html');

      const MAX_UNDO = 5;
      const boardFrame = document.getElementById('boardFrame');
      const boardInner = document.getElementById('boardInner');
      const bgGrid = document.getElementById('bgGrid');
      const tileLayer = document.getElementById('tileLayer');
      const scoreValEl = document.getElementById('scoreVal');
      const bestValEl = document.getElementById('bestVal');
      const maxTileValEl = document.getElementById('maxTileVal');
      const scoreFloatHost = document.getElementById('scoreFloatHost');
      const undoBtn = document.getElementById('undoBtn');
      const newGameBtn = document.getElementById('newGameBtn');
      const muteBtn = document.getElementById('muteBtn');
      const winOverlay = document.getElementById('winOverlay');
      const overOverlay = document.getElementById('overOverlay');
      const winSummary = document.getElementById('winSummary');
      const overSummary = document.getElementById('overSummary');
      const keepPlayingBtn = document.getElementById('keepPlayingBtn');
      const winRestartBtn = document.getElementById('winRestartBtn');
      const overUndoBtn = document.getElementById('overUndoBtn');
      const overRestartBtn = document.getElementById('overRestartBtn');

      let gridSize = 4;
      let theme = 'neon';
      let uidCounter = 1;
      let tiles = [];          // Active logical tiles: { id, val, r, c }
      let domMap = new Map();  // id -> HTMLElement (.tile-el)
      let dyingEls = [];       // Elements mid-slide into a merge target
      let cleanupTimer = null;

      let score = 0;
      let bestScore = 0;
      let undoStack = [];      // Up to 5 snapshots
      let hasWon2048 = false;
      let keepPlaying = false;
      let isGameOver = false;

      // Cached geometry metrics
      let cellPx = 80;
      let stepPx = 90;

      function syncMuteBtn() {
        muteBtn.textContent = ArcadeSFX.isMuted() ? '🔇 静音' : '🔊 音效';
      }
      syncMuteBtn();
      muteBtn.addEventListener('click', function () {
        ArcadeSFX.toggleMute();
        syncMuteBtn();
      });

      function bestKey(size) {
        return 'pixel_2048_best_v2_' + size;
      }

      function loadBest(size) {
        try {
          let v = parseInt(localStorage.getItem(bestKey(size)) || '0', 10);
          return Number.isFinite(v) && v > 0 ? v : 0;
        } catch (e) {
          return 0;
        }
      }

      function saveBest(size, val) {
        try {
          localStorage.setItem(bestKey(size), String(val));
        } catch (e) {}
      }

      function loadTheme() {
        try {
          const t = localStorage.getItem('pixel_2048_theme');
          if (t === 'warm' || t === 'neon') theme = t;
        } catch (e) {}
      }

      function applyTheme(nextTheme) {
        theme = nextTheme;
        boardFrame.setAttribute('data-theme', theme);
        document.querySelectorAll('#themeGroup .seg-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.theme === theme);
        });
        try {
          localStorage.setItem('pixel_2048_theme', theme);
        } catch (e) {}
      }

      function computeMetrics() {
        const gap = gridSize === 5 ? (boardInner.clientWidth < 330 ? 6 : 8) : (boardInner.clientWidth < 330 ? 8 : 10);
        const radius = gridSize === 5 ? '10px' : '12px';
        boardFrame.style.setProperty('--grid-n', String(gridSize));
        boardFrame.style.setProperty('--grid-gap', gap + 'px');
        boardFrame.style.setProperty('--cell-radius', radius);

        const w = boardInner.clientWidth;
        cellPx = (w - gap * (gridSize - 1)) / gridSize;
        stepPx = cellPx + gap;
      }

      function buildBgGrid() {
        boardFrame.setAttribute('data-size', String(gridSize));
        computeMetrics();
        let html = '';
        const total = gridSize * gridSize;
        for (let i = 0; i < total; i++) {
          html += '<div class="bg-cell"></div>';
        }
        bgGrid.innerHTML = html;
      }

      function fontSizeForVal(val) {
        const digits = String(val).length;
        const ratio = digits <= 2 ? 0.44 : digits === 3 ? 0.36 : digits === 4 ? 0.30 : 0.24;
        return Math.max(13, Math.round(cellPx * ratio)) + 'px';
      }

      function tileColorClass(val) {
        return val <= 2048 ? 't-' + val : 't-super';
      }

      function positionTileEl(el, r, c) {
        const x = Math.round(c * stepPx * 100) / 100;
        const y = Math.round(r * stepPx * 100) / 100;
        el.style.width = cellPx + 'px';
        el.style.height = cellPx + 'px';
        el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      }

      function flushDyingDom() {
        if (cleanupTimer) {
          clearTimeout(cleanupTimer);
          cleanupTimer = null;
        }
        while (dyingEls.length) {
          const el = dyingEls.pop();
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }
      }

      function clearAllTileDom() {
        flushDyingDom();
        domMap.clear();
        tileLayer.innerHTML = '';
      }

      function createTileDom(tile, animType) {
        const el = document.createElement('div');
        el.className = 'tile-el' + (animType === 'merge' ? ' is-merged-host' : '');
        positionTileEl(el, tile.r, tile.c);

        const inner = document.createElement('div');
        inner.className = 'tile-inner ' + tileColorClass(tile.val) +
          (animType === 'new' ? ' anim-new' : animType === 'merge' ? ' anim-merge' : '');
        inner.style.fontSize = fontSizeForVal(tile.val);
        inner.textContent = String(tile.val);

        el.appendChild(inner);
        tileLayer.appendChild(el);
        domMap.set(tile.id, el);
        return el;
      }

      function refreshAllGeometryWithoutAnim() {
        boardFrame.classList.add('no-anim');
        computeMetrics();
        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          const el = domMap.get(t.id);
          if (el) {
            positionTileEl(el, t.r, t.c);
            const inner = el.firstElementChild;
            if (inner) inner.style.fontSize = fontSizeForVal(t.val);
          }
        }
        // Force reflow before restoring transitions
        void boardFrame.offsetWidth;
        boardFrame.classList.remove('no-anim');
      }

      function showScoreDelta(delta) {
        if (delta <= 0) return;
        const badge = document.createElement('span');
        badge.className = 'score-float';
        badge.textContent = '+' + delta;
        scoreFloatHost.appendChild(badge);
        setTimeout(function () {
          if (badge.parentNode) badge.parentNode.removeChild(badge);
        }, 740);
      }

      function updateHUD(scoreDelta) {
        scoreValEl.textContent = String(score);
        if (score > bestScore) {
          bestScore = score;
          saveBest(gridSize, bestScore);
        }
        bestValEl.textContent = String(bestScore);

        let maxV = 2;
        for (let i = 0; i < tiles.length; i++) {
          if (tiles[i].val > maxV) maxV = tiles[i].val;
        }
        maxTileValEl.textContent = String(maxV);

        undoBtn.textContent = '↩ 撤销一步 (' + undoStack.length + ')';
        undoBtn.disabled = undoStack.length === 0;
        overUndoBtn.style.display = undoStack.length > 0 ? 'inline-flex' : 'none';

        if (scoreDelta > 0) {
          showScoreDelta(scoreDelta);
        }
      }

      function getGridMatrix() {
        const mat = Array.from({ length: gridSize }, function () {
          return Array(gridSize).fill(null);
        });
        for (let i = 0; i < tiles.length; i++) {
          const t = tiles[i];
          mat[t.r][t.c] = t;
        }
        return mat;
      }

      function spawnRandomTile(animate) {
        const mat = getGridMatrix();
        const empty = [];
        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            if (!mat[r][c]) empty.push({ r: r, c: c });
          }
        }
        if (!empty.length) return null;
        const spot = empty[(Math.random() * empty.length) | 0];
        const tile = {
          id: uidCounter++,
          val: Math.random() < 0.9 ? 2 : 4,
          r: spot.r,
          c: spot.c
        };
        tiles.push(tile);
        createTileDom(tile, animate ? 'new' : '');
        return tile;
      }

      function hasAvailableMoves() {
        if (tiles.length < gridSize * gridSize) return true;
        const mat = getGridMatrix();
        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const v = mat[r][c].val;
            if (r + 1 < gridSize && mat[r + 1][c].val === v) return true;
            if (c + 1 < gridSize && mat[r][c + 1].val === v) return true;
          }
        }
        return false;
      }

      function hideModals() {
        winOverlay.classList.add('hidden');
        overOverlay.classList.add('hidden');
      }

      function startNewGame() {
        hideModals();
        clearAllTileDom();
        buildBgGrid();
        tiles = [];
        undoStack = [];
        score = 0;
        bestScore = loadBest(gridSize);
        hasWon2048 = false;
        keepPlaying = false;
        isGameOver = false;

        spawnRandomTile(true);
        spawnRandomTile(true);
        updateHUD(0);
      }

      // Direction: 0 = Left, 1 = Right, 2 = Up, 3 = Down
      function move(dir) {
        if (isGameOver) return;
        if (!winOverlay.classList.contains('hidden')) return;

        // Clean up any previous merge-dying DOM nodes immediately for rapid key safety
        flushDyingDom();

        const prevSnapshot = {
          tiles: tiles.map(function (t) { return { id: t.id, val: t.val, r: t.r, c: t.c }; }),
          score: score,
          hasWon2048: hasWon2048,
          keepPlaying: keepPlaying
        };

        const mat = getGridMatrix();
        const nextTiles = [];
        const mergedCreated = [];
        let moved = false;
        let gained = 0;
        let maxMergedVal = 0;

        for (let lineIdx = 0; lineIdx < gridSize; lineIdx++) {
          const lineTiles = [];
          for (let step = 0; step < gridSize; step++) {
            let r, c;
            if (dir === 0) { r = lineIdx; c = step; }
            else if (dir === 1) { r = lineIdx; c = gridSize - 1 - step; }
            else if (dir === 2) { r = step; c = lineIdx; }
            else { r = gridSize - 1 - step; c = lineIdx; }
            if (mat[r][c]) lineTiles.push(mat[r][c]);
          }

          let targetSlot = 0;
          let idx = 0;
          while (idx < lineTiles.length) {
            const cur = lineTiles[idx];
            let destR, destC;
            if (dir === 0) { destR = lineIdx; destC = targetSlot; }
            else if (dir === 1) { destR = lineIdx; destC = gridSize - 1 - targetSlot; }
            else if (dir === 2) { destR = targetSlot; destC = lineIdx; }
            else { destR = gridSize - 1 - targetSlot; destC = lineIdx; }

            if (idx + 1 < lineTiles.length && lineTiles[idx + 1].val === cur.val) {
              const partner = lineTiles[idx + 1];
              const mergedVal = cur.val * 2;
              moved = true;
              gained += mergedVal;
              if (mergedVal > maxMergedVal) maxMergedVal = mergedVal;

              // Slide both constituent tiles into (destR, destC)
              const el1 = domMap.get(cur.id);
              const el2 = domMap.get(partner.id);
              if (el1) {
                el1.classList.add('is-dying');
                positionTileEl(el1, destR, destC);
                dyingEls.push(el1);
                domMap.delete(cur.id);
              }
              if (el2) {
                el2.classList.add('is-dying');
                positionTileEl(el2, destR, destC);
                dyingEls.push(el2);
                domMap.delete(partner.id);
              }

              const newTile = {
                id: uidCounter++,
                val: mergedVal,
                r: destR,
                c: destC
              };
              nextTiles.push(newTile);
              mergedCreated.push(newTile);

              targetSlot++;
              idx += 2;
            } else {
              if (cur.r !== destR || cur.c !== destC) {
                moved = true;
                cur.r = destR;
                cur.c = destC;
              }
              const el = domMap.get(cur.id);
              if (el) {
                el.classList.remove('is-merged-host');
                positionTileEl(el, destR, destC);
              }
              nextTiles.push(cur);
              targetSlot++;
              idx += 1;
            }
          }
        }

        if (!moved) return;

        // Commit state & save undo snapshot
        undoStack.push(prevSnapshot);
        if (undoStack.length > MAX_UNDO) undoStack.shift();

        tiles = nextTiles;
        score += gained;

        for (let i = 0; i < mergedCreated.length; i++) {
          createTileDom(mergedCreated[i], 'merge');
          if (mergedCreated[i].val >= 2048 && !hasWon2048) {
            hasWon2048 = true;
          }
        }

        spawnRandomTile(true);
        updateHUD(gained);

        if (maxMergedVal > 0) {
          ArcadeSFX.play('merge', Math.log2(maxMergedVal));
        } else {
          ArcadeSFX.play('move');
        }

        cleanupTimer = setTimeout(flushDyingDom, 150);

        // Check 2048 victory modal
        if (hasWon2048 && !keepPlaying) {
          setTimeout(function () {
            ArcadeSFX.play('win');
            winSummary.textContent = '当前得分 ' + score + ' 分！你可以继续挑战 4096 甚至 8192！';
            winOverlay.classList.remove('hidden');
          }, 180);
          return;
        }

        // Check game over
        if (!hasAvailableMoves()) {
          isGameOver = true;
          setTimeout(function () {
            ArcadeSFX.play('lose');
            let maxV = 2;
            for (let i = 0; i < tiles.length; i++) {
              if (tiles[i].val > maxV) maxV = tiles[i].val;
            }
            overSummary.textContent = '本局得分 ' + score + ' · 合成最大方块 ' + maxV;
            overOverlay.classList.remove('hidden');
          }, 210);
        }
      }

      function undoMove() {
        if (!undoStack.length) return;
        const snap = undoStack.pop();
        hideModals();
        isGameOver = false;
        clearAllTileDom();

        score = snap.score;
        hasWon2048 = snap.hasWon2048;
        keepPlaying = snap.keepPlaying;
        tiles = snap.tiles.map(function (t) {
          return { id: t.id, val: t.val, r: t.r, c: t.c };
        });

        for (let i = 0; i < tiles.length; i++) {
          createTileDom(tiles[i], 'new');
        }
        ArcadeSFX.play('click');
        updateHUD(0);
      }

      // Controls wiring
      document.getElementById('sizeGroup').addEventListener('click', function (e) {
        const btn = e.target.closest('.seg-btn');
        if (!btn) return;
        const nextSize = parseInt(btn.dataset.size, 10);
        if (nextSize === gridSize) return;
        gridSize = nextSize;
        document.querySelectorAll('#sizeGroup .seg-btn').forEach(function (b) {
          b.classList.toggle('active', parseInt(b.dataset.size, 10) === gridSize);
        });
        ArcadeSFX.play('click');
        startNewGame();
      });

      document.getElementById('themeGroup').addEventListener('click', function (e) {
        const btn = e.target.closest('.seg-btn');
        if (!btn) return;
        const nextTheme = btn.dataset.theme;
        if (nextTheme === theme) return;
        ArcadeSFX.play('click');
        applyTheme(nextTheme);
      });

      undoBtn.addEventListener('click', undoMove);
      overUndoBtn.addEventListener('click', undoMove);

      newGameBtn.addEventListener('click', function () {
        ArcadeSFX.play('click');
        startNewGame();
      });

      winRestartBtn.addEventListener('click', function () {
        ArcadeSFX.play('click');
        startNewGame();
      });

      overRestartBtn.addEventListener('click', function () {
        ArcadeSFX.play('click');
        startNewGame();
      });

      keepPlayingBtn.addEventListener('click', function () {
        keepPlaying = true;
        ArcadeSFX.play('power');
        winOverlay.classList.add('hidden');
        if (!hasAvailableMoves()) {
          isGameOver = true;
          overSummary.textContent = '本局得分 ' + score;
          overOverlay.classList.remove('hidden');
        }
      });

      // Keyboard controls
      window.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const keyMap = {
          ArrowLeft: 0, a: 0, A: 0,
          ArrowRight: 1, d: 1, D: 1,
          ArrowUp: 2, w: 2, W: 2,
          ArrowDown: 3, s: 3, S: 3
        };
        if (keyMap[e.key] !== undefined) {
          e.preventDefault();
          move(keyMap[e.key]);
        } else if (e.key === 'z' || e.key === 'Z') {
          e.preventDefault();
          undoMove();
        }
      });

      // Smooth pointer / touch swipe handling
      let swipeStartX = 0;
      let swipeStartY = 0;
      let pointerActive = false;

      boardFrame.addEventListener('pointerdown', function (e) {
        if (e.target.closest('button')) return;
        pointerActive = true;
        swipeStartX = e.clientX;
        swipeStartY = e.clientY;
      });

      boardFrame.addEventListener('pointerup', function (e) {
        if (!pointerActive) return;
        pointerActive = false;
        const dx = e.clientX - swipeStartX;
        const dy = e.clientY - swipeStartY;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);
        if (Math.max(absX, absY) < 24) return;
        if (absX > absY) {
          move(dx > 0 ? 1 : 0);
        } else {
          move(dy > 0 ? 3 : 2);
        }
      });

      boardFrame.addEventListener('pointercancel', function () {
        pointerActive = false;
      });

      // Responsive geometry updates
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(function () {
          refreshAllGeometryWithoutAnim();
        });
        ro.observe(boardInner);
      } else {
        window.addEventListener('resize', refreshAllGeometryWithoutAnim);
      }

      loadTheme();
      applyTheme(theme);
      startNewGame();
    })();
  </script>
</body>
</html>
