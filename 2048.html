<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 · 像素游乐场</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f2ff;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.back{padding:9px 14px;border:1px solid #304968;border-radius:10px;background:#0e2036}.panel{background:#0d1d31;border:1px solid #24405f;border-radius:18px;padding:20px;box-shadow:0 16px 45px #0004}button{font:inherit;color:inherit;background:#163452;border:1px solid #38618a;border-radius:9px;padding:9px 14px;cursor:pointer}button:hover{background:#214a70}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#94acc7}.score{font-size:18px;color:#7de2ff}canvas{display:block;max-width:100%;margin:auto;background:#06101c;border-radius:12px;border:1px solid #284665}input{background:#071524;color:white;border:1px solid #315275;padding:8px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{padding:18px;border-radius:16px;background:linear-gradient(145deg,#122944,#0b1b2f);border:1px solid #2b4c6d;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#6bdcff}.emoji{font-size:38px}.card h3{margin:8px 0}.hero{padding:32px 0}.hero h1{font-size:clamp(36px,7vw,72px);margin:4px 0;background:linear-gradient(90deg,#7de2ff,#b8a1ff);color:transparent;background-clip:text}.tag{display:inline-block;color:#7de2ff;background:#123653;padding:5px 10px;border-radius:999px;font-size:13px}.tips{line-height:1.7;color:#a9bfd6}.memory{display:grid;grid-template-columns:repeat(4,72px);gap:10px;justify-content:center}.memory button{height:72px;font-size:30px;padding:0;background:#163452}.mine{display:grid;grid-template-columns:repeat(9,34px);gap:3px;justify-content:center}.mine button{width:34px;height:34px;padding:0;font-size:14px}.tiles{display:grid;grid-template-columns:repeat(4,72px);gap:8px;justify-content:center}.tile{height:72px;display:grid;place-items:center;border-radius:8px;background:#18324e;font-size:25px;font-weight:bold}.t2{background:#315578}.t4{background:#36758d}.t8{background:#bc744a}.t16{background:#bf4b52}.t32{background:#9853a9}.t64{background:#e7a13b}.t128{background:#d5c15a;color:#142033}.t256,.t512,.t1024,.t2048{background:#65d0aa;color:#102431}footer{padding:28px 0;color:#7089a5;text-align:center}@media(max-width:600px){.wrap{padding:16px}.memory{grid-template-columns:repeat(4,64px)}.memory button{height:64px}.tiles{grid-template-columns:repeat(4,64px)}.tile{height:64px}.mine{grid-template-columns:repeat(9,30px)}.mine button{width:30px;height:30px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">🎮 像素游乐场</a><a class="back" href="index.html">← 返回大厅</a></header><section class="panel"><h1>🔢 2048</h1><p class="score">分数：<b id="sc">0</b></p><div id="g" class="tiles"></div><div class="actions"><button onclick="newGame()">新游戏</button><span class="muted">方向键 / WASD / 手机滑动</span></div></section></main><script>let a,score,history=[],won=false;document.querySelector('.actions').insertAdjacentHTML('beforeend','<button onclick="undo()">撤销一步</button><span class="muted" id="state"></span>');function newGame(){a=Array(16).fill(0);score=0;history=[];won=false;add();add();draw()}function add(){let q=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(q.length){let i=q[Math.random()*q.length|0];a[i]=Math.random()<.9?2:4}}function draw(){g.innerHTML=a.map(v=>`<div class="tile ${v?'t'+v:''}">${v||''}</div>`).join('');sc.textContent=score;state.textContent=won?'已达成 2048！继续挑战更高分':canMove()?'':'游戏结束'}function slide(line){let old=line.join(),q=line.filter(Boolean);for(let j=0;j<q.length-1;j++)if(q[j]===q[j+1]){q[j]*=2;score+=q[j];if(q[j]===2048)won=true;q.splice(j+1,1)}while(q.length<4)q.push(0);return [q,old!==q.join()] }function move(d){let before=a.slice(),oldScore=score,changed=false;for(let i=0;i<4;i++){let line=d<2?a.slice(i*4,i*4+4):[a[i],a[i+4],a[i+8],a[i+12]];if(d===1||d===3)line.reverse();let r=slide(line);line=r[0];if(d===1||d===3)line.reverse();for(let j=0;j<4;j++)a[d<2?i*4+j:i+j*4]=line[j];changed=changed||r[1]}if(changed){history.push({a:before,score:oldScore});add();draw();if(!canMove())setTimeout(()=>alert('游戏结束！得分 '+score),30)}}function undo(){let h=history.pop();if(h){a=h.a;score=h.score;draw()}}function canMove(){if(a.some(v=>!v))return true;for(let y=0;y<4;y++)for(let x=0;x<4;x++){let i=y*4+x;if(x<3&&a[i]===a[i+1]||y<3&&a[i]===a[i+4])return true}return false}addEventListener('keydown',e=>{let d={ArrowLeft:0,a:0,ArrowRight:1,d:1,ArrowUp:2,w:2,ArrowDown:3,s:3}[e.key];if(d!==undefined){e.preventDefault();move(d)}});let sx,sy;g.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});g.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2))});newGame();</script></body></html>
