<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打砖块</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f2ff;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.back{padding:9px 14px;border:1px solid #304968;border-radius:10px;background:#0e2036}.panel{background:#0d1d31;border:1px solid #24405f;border-radius:18px;padding:20px;box-shadow:0 16px 45px #0004}button{font:inherit;color:inherit;background:#163452;border:1px solid #38618a;border-radius:9px;padding:9px 14px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#94acc7}.score{font-size:18px;color:#7de2ff}canvas{display:block;max-width:100%;margin:auto;background:#06101c;border-radius:12px;border:1px solid #284665}.memory{display:grid;grid-template-columns:repeat(4,72px);gap:10px;justify-content:center}.memory button{height:72px;font-size:30px;padding:0}.mine{display:grid;grid-template-columns:repeat(9,34px);gap:3px;justify-content:center}.mine button{width:34px;height:34px;padding:0;font-size:14px}@media(max-width:600px){.wrap{padding:16px}.memory{grid-template-columns:repeat(4,60px)}.memory button{height:60px}.mine{grid-template-columns:repeat(9,28px)}.mine button{width:28px;height:28px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">🎮 像素游乐场</a><a class="back" href="index.html">← 返回大厅</a></header><section class="panel"><h1>🏓 打砖块</h1><p class="score">得分：<b id="sc">0</b></p><canvas id="c" width="520" height="360"></canvas><div class="actions"><button onclick="start()">开始 / 重开</button><span class="muted">鼠标或方向键移动挡板</span></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let ball,pad,bricks,score,raf,over=false;function start(){ball={x:260,y:300,dx:3,dy:-3};pad=220;bricks=[];score=0;over=false;sc.textContent=0;for(let r=0;r<4;r++)for(let k=0;k<8;k++)bricks.push({x:k*64+2,y:r*24+20,on:1});cancelAnimationFrame(raf);loop()}function loop(){if(over)return;x.fillStyle='#06101c';x.fillRect(0,0,520,360);bricks.forEach(b=>{if(b.on){x.fillStyle='#65d0aa';x.fillRect(b.x,b.y,60,18)}});x.fillStyle='#7de2ff';x.fillRect(pad,340,80,10);x.beginPath();x.arc(ball.x,ball.y,7,0,7);x.fill();ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<7||ball.x>513)ball.dx*=-1;if(ball.y<7)ball.dy*=-1;if(ball.y+7>=340&&ball.y<350&&ball.x>pad&&ball.x<pad+80){ball.y=332;ball.dy=-Math.abs(ball.dy)}bricks.forEach(b=>{if(b.on&&ball.x+7>b.x&&ball.x-7<b.x+60&&ball.y+7>b.y&&ball.y-7<b.y+18){b.on=0;ball.dy*=-1;score+=10;sc.textContent=score}});if(!bricks.some(b=>b.on)){over=true;setTimeout(()=>alert('通关！'),20)}if(ball.y>370){over=true;setTimeout(()=>alert('游戏结束！'),20)}raf=requestAnimationFrame(loop)}addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();pad=Math.max(0,Math.min(440,(e.clientX-r.left)*520/r.width-40))});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pad=Math.max(0,pad-25);if(e.key==='ArrowRight')pad=Math.min(440,pad+25)});start();</script></body></html>
