<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贪吃蛇 · 像素游乐场</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f2ff;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.back{padding:9px 14px;border:1px solid #304968;border-radius:10px;background:#0e2036}.panel{background:#0d1d31;border:1px solid #24405f;border-radius:18px;padding:20px;box-shadow:0 16px 45px #0004}button{font:inherit;color:inherit;background:#163452;border:1px solid #38618a;border-radius:9px;padding:9px 14px;cursor:pointer}button:hover{background:#214a70}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#94acc7}.score{font-size:18px;color:#7de2ff}canvas{display:block;max-width:100%;margin:auto;background:#06101c;border-radius:12px;border:1px solid #284665}input{background:#071524;color:white;border:1px solid #315275;padding:8px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{padding:18px;border-radius:16px;background:linear-gradient(145deg,#122944,#0b1b2f);border:1px solid #2b4c6d;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#6bdcff}.emoji{font-size:38px}.card h3{margin:8px 0}.hero{padding:32px 0}.hero h1{font-size:clamp(36px,7vw,72px);margin:4px 0;background:linear-gradient(90deg,#7de2ff,#b8a1ff);color:transparent;background-clip:text}.tag{display:inline-block;color:#7de2ff;background:#123653;padding:5px 10px;border-radius:999px;font-size:13px}.tips{line-height:1.7;color:#a9bfd6}.memory{display:grid;grid-template-columns:repeat(4,72px);gap:10px;justify-content:center}.memory button{height:72px;font-size:30px;padding:0;background:#163452}.mine{display:grid;grid-template-columns:repeat(9,34px);gap:3px;justify-content:center}.mine button{width:34px;height:34px;padding:0;font-size:14px}.tiles{display:grid;grid-template-columns:repeat(4,72px);gap:8px;justify-content:center}.tile{height:72px;display:grid;place-items:center;border-radius:8px;background:#18324e;font-size:25px;font-weight:bold}.t2{background:#315578}.t4{background:#36758d}.t8{background:#bc744a}.t16{background:#bf4b52}.t32{background:#9853a9}.t64{background:#e7a13b}.t128{background:#d5c15a;color:#142033}.t256,.t512,.t1024,.t2048{background:#65d0aa;color:#102431}footer{padding:28px 0;color:#7089a5;text-align:center}@media(max-width:600px){.wrap{padding:16px}.memory{grid-template-columns:repeat(4,64px)}.memory button{height:64px}.tiles{grid-template-columns:repeat(4,64px)}.tile{height:64px}.mine{grid-template-columns:repeat(9,30px)}.mine button{width:30px;height:30px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">🎮 像素游乐场</a><a class="back" href="index.html">← 返回大厅</a></header><section class="panel"><h1>🐍 贪吃蛇</h1><p class="score">得分：<b id="sc">0</b></p><canvas id="c" width="420" height="420"></canvas><div class="actions"><button id="start">开始 / 重开</button><span class="muted">方向键或 WASD 控制</span></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),N=21,Z=20;let snake,food,bonus,rocks,dir,next,timer,score,level,paused,alive;const bestKey='snake-best';document.querySelector('.actions').insertAdjacentHTML('beforeend','<button id="pause">暂停</button><span class="muted" id="status">准备开始</span>');function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;level=1;paused=false;alive=true;rocks=[];spawnRocks(5);placeFood();bonus=null;document.querySelector('#sc').textContent=0;document.querySelector('#pause').textContent='暂停';document.querySelector('#status').textContent='进行中';clearInterval(timer);timer=setInterval(tick,150);draw()}function spawnRocks(count){while(count--){let q;do q={x:Math.random()*N|0,y:Math.random()*N|0};while(snake.some(p=>p.x===q.x&&p.y===q.y)||rocks.some(p=>p.x===q.x&&p.y===q.y));rocks.push(q)}}function placeFood(){do food={x:Math.random()*N|0,y:Math.random()*N|0};while(snake.some(p=>p.x===food.x&&p.y===food.y)||rocks.some(p=>p.x===food.x&&p.y===food.y))}function end(msg){alive=false;clearInterval(timer);document.querySelector('#status').textContent=msg;let best=Math.max(score,+localStorage.getItem(bestKey)||0);localStorage.setItem(bestKey,best);setTimeout(()=>alert(msg+' 得分 '+score+'，最高 '+best),30)}function tick(){if(paused||!alive)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)||rocks.some(p=>p.x===h.x&&p.y===h.y))return end('撞到障碍');snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10*level;document.querySelector('#sc').textContent=score;if(score%50===0){level++;spawnRocks(2);clearInterval(timer);timer=setInterval(tick,Math.max(55,150-level*12))}placeFood();if(Math.random()<.25){bonus={x:Math.random()*N|0,y:Math.random()*N|0}}}else if(bonus&&h.x===bonus.x&&h.y===bonus.y){score+=50;bonus=null;document.querySelector('#sc').textContent=score}else snake.pop();draw()}function draw(){x.fillStyle='#06101c';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#102c43';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*Z,0);x.lineTo(i*Z,c.height);x.stroke();x.beginPath();x.moveTo(0,i*Z);x.lineTo(c.width,i*Z);x.stroke()}x.fillStyle='#ef667d';rocks.forEach(p=>x.fillRect(p.x*Z+3,p.y*Z+3,Z-6,Z-6));x.fillStyle='#ffcf5a';x.beginPath();x.arc(food.x*Z+10,food.y*Z+10,7,0,7);x.fill();if(bonus){x.fillStyle='#b594ff';x.fillRect(bonus.x*Z+4,bonus.y*Z+4,Z-8,Z-8)}snake.forEach((p,i)=>{x.fillStyle=i?'#4dd6a5':'#8df5c7';x.fillRect(p.x*Z+1,p.y*Z+1,Z-2,Z-2)})}document.querySelector('#pause').onclick=()=>{if(!alive)return;paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';document.querySelector('#status').textContent=paused?'已暂停':'进行中'};addEventListener('keydown',e=>{if(e.code==='Space'){document.querySelector('#pause').click();return}let q={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}}[e.key];if(q&&!(q.x===-dir.x&&q.y===-dir.y))next=q});document.querySelector('#start').onclick=reset;reset();</script></body></html>
