<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Astray 3D 滚球迷宫 · 像素游乐场</title>
    <script src="Box2dWeb.min.js"></script>
    <script src="Three.js"></script>
    <script src="keyboard.js"></script>
    <script src="jquery.js"></script>
    <script src="maze.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #050811;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        canvas { display: block; }

        #hud-level {
            position: fixed;
            top: 14px;
            right: 16px;
            z-index: 20;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(9, 16, 29, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 191, 36, 0.42);
            color: #fde68a;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
        }

        #help-bar {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 7px 16px;
            border-radius: 999px;
            background: rgba(9, 16, 29, 0.72);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(125, 226, 255, 0.2);
            color: #9cb6d4;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
        }
        #help-bar b { color: #eaf4ff; }

        #touch-pad {
            display: none;
            position: fixed;
            right: 18px;
            bottom: 52px;
            z-index: 30;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(2, 52px);
            gap: 8px;
        }
        #touch-pad button {
            border-radius: 14px;
            background: rgba(15, 29, 50, 0.78);
            border: 1px solid rgba(125, 226, 255, 0.35);
            color: #eaf4ff;
            font-size: 20px;
            touch-action: none;
            cursor: pointer;
        }
        #touch-pad button:active {
            background: rgba(92, 225, 230, 0.35);
            border-color: #5ce1e6;
        }
        @media (pointer: coarse), (max-width: 768px) {
            #touch-pad { display: grid; }
        }
    </style>
</head>
<body>
    <div id="hud-level">第 1 关 · 11×11 迷宫</div>
    <div id="help-bar"><b>方向键 / WASD</b> 控制滚球滚动 · 寻找右下角出口进入下一层更深迷宫</div>

    <div id="touch-pad">
        <div></div>
        <button data-dx="0" data-dy="1" aria-label="上">▲</button>
        <div></div>
        <button data-dx="-1" data-dy="0" aria-label="左">◀</button>
        <button data-dx="0" data-dy="-1" aria-label="下">▼</button>
        <button data-dx="1" data-dy="0" aria-label="右">▶</button>
    </div>

    <script>
        var camera = undefined,
            scene = undefined,
            renderer = undefined,
            light = undefined,
            maze = undefined,
            mazeMesh = undefined,
            mazeDimension = 11,
            planeMesh = undefined,
            ballMesh = undefined,
            ballRadius = 0.25,
            keyAxis = [0, 0],
            touchAxis = [0, 0],
            heldKeys = {},
            ironTexture = THREE.ImageUtils.loadTexture('ball.png'),
            planeTexture = THREE.ImageUtils.loadTexture('concrete.png'),
            brickTexture = THREE.ImageUtils.loadTexture('brick.png'),
            gameState = undefined,

            b2World = Box2D.Dynamics.b2World,
            b2FixtureDef = Box2D.Dynamics.b2FixtureDef,
            b2BodyDef = Box2D.Dynamics.b2BodyDef,
            b2Body = Box2D.Dynamics.b2Body,
            b2CircleShape = Box2D.Collision.Shapes.b2CircleShape,
            b2PolygonShape = Box2D.Collision.Shapes.b2PolygonShape,
            b2Vec2 = Box2D.Common.Math.b2Vec2,

            wWorld = undefined,
            wBall = undefined;

        function createPhysicsWorld() {
            wWorld = new b2World(new b2Vec2(0, 0), true);

            var bodyDef = new b2BodyDef();
            bodyDef.type = b2Body.b2_dynamicBody;
            bodyDef.position.Set(1, 1);
            wBall = wWorld.CreateBody(bodyDef);
            var fixDef = new b2FixtureDef();
            fixDef.density = 1.0;
            fixDef.friction = 0.0;
            fixDef.restitution = 0.25;
            fixDef.shape = new b2CircleShape(ballRadius);
            wBall.CreateFixture(fixDef);

            bodyDef.type = b2Body.b2_staticBody;
            fixDef.shape = new b2PolygonShape();
            fixDef.shape.SetAsBox(0.5, 0.5);
            for (var i = 0; i < maze.dimension; i++) {
                for (var j = 0; j < maze.dimension; j++) {
                    if (maze[i][j]) {
                        bodyDef.position.x = i;
                        bodyDef.position.y = j;
                        wWorld.CreateBody(bodyDef).CreateFixture(fixDef);
                    }
                }
            }
        }

        function generate_maze_mesh(field) {
            var dummy = new THREE.Geometry();
            for (var i = 0; i < field.dimension; i++) {
                for (var j = 0; j < field.dimension; j++) {
                    if (field[i][j]) {
                        var geometry = new THREE.CubeGeometry(1, 1, 1, 1, 1, 1);
                        var mesh_ij = new THREE.Mesh(geometry);
                        mesh_ij.position.x = i;
                        mesh_ij.position.y = j;
                        mesh_ij.position.z = 0.5;
                        THREE.GeometryUtils.merge(dummy, mesh_ij);
                    }
                }
            }
            var material = new THREE.MeshPhongMaterial({ map: brickTexture });
            return new THREE.Mesh(dummy, material);
        }

        function createRenderWorld() {
            scene = new THREE.Scene();

            light = new THREE.PointLight(0xffffff, 1);
            light.position.set(1, 1, 1.3);
            scene.add(light);

            var g = new THREE.SphereGeometry(ballRadius, 32, 16);
            var m = new THREE.MeshPhongMaterial({ map: ironTexture });
            ballMesh = new THREE.Mesh(g, m);
            ballMesh.position.set(1, 1, ballRadius);
            scene.add(ballMesh);

            var aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(60, aspect, 1, 1000);
            camera.position.set(1, 1, 5);
            scene.add(camera);

            mazeMesh = generate_maze_mesh(maze);
            scene.add(mazeMesh);

            g = new THREE.PlaneGeometry(mazeDimension * 10, mazeDimension * 10, mazeDimension, mazeDimension);
            planeTexture.wrapS = planeTexture.wrapT = THREE.RepeatWrapping;
            planeTexture.repeat.set(mazeDimension * 5, mazeDimension * 5);
            m = new THREE.MeshPhongMaterial({ map: planeTexture });
            planeMesh = new THREE.Mesh(g, m);
            planeMesh.position.set((mazeDimension - 1) / 2, (mazeDimension - 1) / 2, 0);
            planeMesh.rotation.set(Math.PI / 2, 0, 0);
            scene.add(planeMesh);
        }

        function computeInputAxis() {
            var ax = keyAxis[0] || touchAxis[0];
            var ay = keyAxis[1] || touchAxis[1];
            if (heldKeys.ArrowLeft || heldKeys.KeyA) ax = -1;
            if (heldKeys.ArrowRight || heldKeys.KeyD) ax = 1;
            if (heldKeys.ArrowUp || heldKeys.KeyW) ay = 1;
            if (heldKeys.ArrowDown || heldKeys.KeyS) ay = -1;
            return [ax, ay];
        }

        function updatePhysicsWorld() {
            var lv = wBall.GetLinearVelocity();
            lv.Multiply(0.95);
            wBall.SetLinearVelocity(lv);

            var axis = computeInputAxis();
            var f = new b2Vec2(axis[0] * wBall.GetMass() * 0.25, axis[1] * wBall.GetMass() * 0.25);
            wBall.ApplyImpulse(f, wBall.GetPosition());
            keyAxis = [0, 0];

            wWorld.Step(1 / 60, 8, 3);
        }

        function updateRenderWorld() {
            var stepX = wBall.GetPosition().x - ballMesh.position.x;
            var stepY = wBall.GetPosition().y - ballMesh.position.y;
            ballMesh.position.x += stepX;
            ballMesh.position.y += stepY;

            var tempMat = new THREE.Matrix4();
            tempMat.makeRotationAxis(new THREE.Vector3(0, 1, 0), stepX / ballRadius);
            tempMat.multiplySelf(ballMesh.matrix);
            ballMesh.matrix = tempMat;
            tempMat = new THREE.Matrix4();
            tempMat.makeRotationAxis(new THREE.Vector3(1, 0, 0), -stepY / ballRadius);
            tempMat.multiplySelf(ballMesh.matrix);
            ballMesh.matrix = tempMat;
            ballMesh.rotation.getRotationFromMatrix(ballMesh.matrix);

            camera.position.x += (ballMesh.position.x - camera.position.x) * 0.1;
            camera.position.y += (ballMesh.position.y - camera.position.y) * 0.1;
            camera.position.z += (5 - camera.position.z) * 0.1;
            light.position.x = camera.position.x;
            light.position.y = camera.position.y;
            light.position.z = camera.position.z - 3.7;
        }

        function gameLoop() {
            switch (gameState) {
                case 'initialize':
                    maze = generateSquareMaze(mazeDimension);
                    maze[mazeDimension - 1][mazeDimension - 2] = false;
                    createPhysicsWorld();
                    createRenderWorld();
                    camera.position.set(1, 1, 5);
                    light.position.set(1, 1, 1.3);
                    light.intensity = 0;
                    var level = Math.floor((mazeDimension - 1) / 2 - 4);
                    $('#hud-level').text('第 ' + level + ' 关 · ' + mazeDimension + '×' + mazeDimension + ' 迷宫');
                    gameState = 'fade in';
                    break;

                case 'fade in':
                    light.intensity += 0.1 * (1.0 - light.intensity);
                    renderer.render(scene, camera);
                    if (Math.abs(light.intensity - 1.0) < 0.05) {
                        light.intensity = 1.0;
                        gameState = 'play';
                    }
                    break;

                case 'play':
                    updatePhysicsWorld();
                    updateRenderWorld();
                    renderer.render(scene, camera);

                    var mazeX = Math.floor(ballMesh.position.x + 0.5);
                    var mazeY = Math.floor(ballMesh.position.y + 0.5);
                    if (mazeX === mazeDimension && mazeY === mazeDimension - 2) {
                        mazeDimension += 2;
                        gameState = 'fade out';
                    }
                    break;

                case 'fade out':
                    updatePhysicsWorld();
                    updateRenderWorld();
                    light.intensity += 0.1 * (0.0 - light.intensity);
                    renderer.render(scene, camera);
                    if (Math.abs(light.intensity - 0.0) < 0.1) {
                        light.intensity = 0.0;
                        renderer.render(scene, camera);
                        gameState = 'initialize';
                    }
                    break;
            }
            requestAnimationFrame(gameLoop);
        }

        function onResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        function onMoveKey(axis) {
            keyAxis = axis.slice(0);
        }

        window.addEventListener('keydown', function (e) { heldKeys[e.code] = true; });
        window.addEventListener('keyup', function (e) { heldKeys[e.code] = false; });

        $(document).ready(function () {
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            KeyboardJS.bind.axis('left', 'right', 'down', 'up', onMoveKey);
            KeyboardJS.bind.axis('h', 'l', 'j', 'k', onMoveKey);
            $(window).resize(onResize);

            $('#touch-pad button').on('pointerdown', function (e) {
                e.preventDefault();
                touchAxis = [Number(this.getAttribute('data-dx')), Number(this.getAttribute('data-dy'))];
            }).on('pointerup pointercancel pointerleave', function () {
                touchAxis = [0, 0];
            });

            gameState = 'initialize';
            requestAnimationFrame(gameLoop);
        });
    </script>
    <script src="../assets/arcade-nav.js" data-home="../index.html" data-pos="top-left" data-game-id="3D迷宫/index.html"></script>
</body>
</html>
