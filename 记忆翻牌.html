<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆翻牌</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f2ff;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.back{padding:9px 14px;border:1px solid #304968;border-radius:10px;background:#0e2036}.panel{background:#0d1d31;border:1px solid #24405f;border-radius:18px;padding:20px;box-shadow:0 16px 45px #0004}button{font:inherit;color:inherit;background:#163452;border:1px solid #38618a;border-radius:9px;padding:9px 14px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#94acc7}.score{font-size:18px;color:#7de2ff}canvas{display:block;max-width:100%;margin:auto;background:#06101c;border-radius:12px;border:1px solid #284665}.memory{display:grid;grid-template-columns:repeat(4,72px);gap:10px;justify-content:center}.memory button{height:72px;font-size:30px;padding:0}.mine{display:grid;grid-template-columns:repeat(9,34px);gap:3px;justify-content:center}.mine button{width:34px;height:34px;padding:0;font-size:14px}@media(max-width:600px){.wrap{padding:16px}.memory{grid-template-columns:repeat(4,60px)}.memory button{height:60px}.mine{grid-template-columns:repeat(9,28px)}.mine button{width:28px;height:28px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">🎮 像素游乐场</a><a class="back" href="index.html">← 返回大厅</a></header><section class="panel"><h1>🧠 记忆翻牌</h1><p class="score">步数：<b id="sc">0</b></p><div id="g" class="memory"></div><div class="actions"><button onclick="newG()">重新开始</button></div></section></main><script>let vals,matched=[],open=[],moves=0,locked=false;function newG(){vals=[...'🍎🍎🍌🍌🍇🍇🍉🍉'].sort(()=>Math.random()-.5);matched=[];open=[];moves=0;locked=false;draw()}function draw(){g.innerHTML=vals.map((v,i)=>`<button onclick="flip(${i})">${matched.includes(i)||open.includes(i)?v:'?'}</button>`).join('');sc.textContent=moves}function flip(i){if(locked||matched.includes(i)||open.includes(i))return;open.push(i);draw();if(open.length===2){moves++;locked=true;let [a,b]=open;if(vals[a]===vals[b]){matched.push(a,b);open=[];locked=false;draw();if(matched.length===vals.length)setTimeout(()=>alert('完成！共 '+moves+' 步'),100)}else setTimeout(()=>{open=[];locked=false;draw()},700)}}newG();</script></body></html>
