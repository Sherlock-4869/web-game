<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太空守卫</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f2ff;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.back,button{padding:9px 14px;border:1px solid #38618a;border-radius:10px;background:#163452;color:inherit;text-decoration:none;cursor:pointer}.panel{background:#0d1d31;border:1px solid #24405f;border-radius:18px;padding:20px}canvas{display:block;max-width:100%;margin:auto;background:#06101c;border-radius:12px;border:1px solid #284665}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#94acc7}.score{font-size:18px;color:#7de2ff}</style><main class="wrap"><header class="top"><a class="brand" href="index.html">🎮 像素游乐场</a><a class="back" href="index.html">← 返回大厅</a></header><section class="panel"><h1>🚀 太空守卫</h1><p class="score">得分：<b id="sc">0</b>　生命：<b id="hp">3</b></p><canvas id="c" width="800" height="480"></canvas><div class="actions"><button onclick="start()">开始 / 重开</button><span class="muted">← → 移动，空格 / 点击射击</span></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let ship,bul,ene,score,hp,run,raf,keys={};function start(){ship={x:380,y:420};bul=[];ene=[];score=0;hp=3;run=1;cancelAnimationFrame(raf);loop()}function shoot(){if(run)bul.push({x:ship.x+18,y:ship.y})}function loop(){if(!run)return;x.fillStyle='#030712';x.fillRect(0,0,800,480);for(let i=0;i<70;i++){x.fillStyle='#ffffff44';x.fillRect((i*97)%800,(i*43+score*2)%450,2,2)}if(Math.random()<.025)ene.push({x:Math.random()*760,y:-30});if(keys.ArrowLeft)ship.x=Math.max(0,ship.x-6);if(keys.ArrowRight)ship.x=Math.min(760,ship.x+6);bul.forEach(b=>b.y-=9);ene.forEach(e=>e.y+=2.5);x.fillStyle='#62e6ff';x.fillRect(ship.x,ship.y,38,30);x.fillStyle='#ff708f';ene.forEach(e=>x.fillRect(e.x,e.y,34,25));x.fillStyle='#fff';bul.forEach(b=>x.fillRect(b.x,b.y,4,12));for(let i=ene.length-1;i>=0;i--)for(let j=bul.length-1;j>=0;j--)if(bul[j].x>ene[i].x&&bul[j].x<ene[i].x+34&&bul[j].y<ene[i].y+25){ene.splice(i,1);bul.splice(j,1);score+=10;break}for(const e of ene)if(e.y>410){hp--;e.y=999;hpEl.textContent=hp;if(hp<=0){run=0;alert('飞船被击毁！得分 '+score);break}}sc.textContent=score;raf=requestAnimationFrame(loop)}const hpEl=document.querySelector('#hp');addEventListener('keydown',e=>{keys[e.key]=1;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>keys[e.key]=0);c.addEventListener('pointerdown',shoot);start();</script>
