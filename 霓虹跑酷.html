<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霓虹跑酷</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f2ff;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.back,button{padding:9px 14px;border:1px solid #38618a;border-radius:10px;background:#163452;color:inherit;text-decoration:none;cursor:pointer}.panel{background:#0d1d31;border:1px solid #24405f;border-radius:18px;padding:20px}canvas{display:block;max-width:100%;margin:auto;background:#06101c;border-radius:12px;border:1px solid #284665}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#94acc7}.score{font-size:18px;color:#7de2ff}</style><main class="wrap"><header class="top"><a class="brand" href="index.html">🎮 像素游乐场</a><a class="back" href="index.html">← 返回大厅</a></header><section class="panel"><h1>🏃 霓虹跑酷</h1><p class="score">距离：<b id="sc">0</b></p><canvas id="c" width="800" height="360"></canvas><div class="actions"><button onclick="start()">开始 / 重开</button><span class="muted">空格 / 点击跳跃</span></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let p,obs,score,raf,run;function start(){p={x:100,y:280,vy:0,on:1};obs=[];score=0;run=1;cancelAnimationFrame(raf);loop()}function loop(){if(!run)return;x.fillStyle='#06101c';x.fillRect(0,0,800,360);x.fillStyle='#182f4a';x.fillRect(0,320,800,40);if(Math.random()<.018)obs.push({x:800,w:24+Math.random()*25,h:30+Math.random()*45});p.vy+=.7;p.y+=p.vy;if(p.y>=280){p.y=280;p.vy=0;p.on=1}obs.forEach(o=>o.x-=5);obs=obs.filter(o=>o.x>-60);x.fillStyle='#7de2ff';x.fillRect(p.x,p.y,34,40);x.fillStyle='#ff7597';obs.forEach(o=>x.fillRect(o.x,320-o.h,o.w,o.h));score++;sc.textContent=Math.floor(score/10);for(const o of obs)if(p.x+34>o.x&&p.x<o.x+o.w&&p.y+40>320-o.h){run=0;alert('撞到障碍，距离 '+Math.floor(score/10));break}raf=requestAnimationFrame(loop)}function jump(){if(p&&p.on){p.vy=-13;p.on=0}}addEventListener('keydown',e=>{if(e.code==='Space')jump()});c.addEventListener('pointerdown',jump);start();</script>
