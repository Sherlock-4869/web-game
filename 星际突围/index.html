<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Radius Raid 星际突围 · 像素游乐场</title>
		<link rel="shortcut icon" id="favicon" />
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				background:
					radial-gradient(800px 500px at 50% 45%, rgba(36, 75, 138, 0.22), transparent 70%),
					#050811;
				overflow: hidden;
				font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
			}

			#wrap {
				background: #121c2e;
				border-radius: 14px;
				box-shadow: inset 0 0 0 1px rgba(125, 226, 255, 0.22), 0 24px 64px rgba(0, 0, 0, 0.78);
				left: 50%;
				opacity: 0;
				padding: 10px;
				position: absolute;
				top: 50%;
				transition: opacity 0.9s ease;
			}

			.loaded #wrap {
				opacity: 1;
			}

			#wrap-inner {
				background: #000;
				border-radius: 8px;
				overflow: hidden;
				position: relative;
			}

			canvas {
				cursor: crosshair;
				display: block;
				left: 0;
				position: absolute;
				top: 0;
			}

			.arcade-hint-bar {
				position: fixed;
				bottom: 12px;
				left: 50%;
				transform: translateX(-50%);
				padding: 6px 16px;
				border-radius: 999px;
				background: rgba(9, 16, 29, 0.72);
				border: 1px solid rgba(125, 226, 255, 0.18);
				color: #8ea9c9;
				font-size: 12px;
				letter-spacing: 0.03em;
				white-space: nowrap;
				pointer-events: none;
				z-index: 20;
			}
			.arcade-hint-bar b { color: #dcf3ff; font-weight: 600; }
		</style>
	</head>
	<body>
		<div id="wrap">
			<div id="wrap-inner">
				<canvas id="cbg1"></canvas>
				<canvas id="cbg2"></canvas>
				<canvas id="cbg3"></canvas>
				<canvas id="cbg4"></canvas>
				<canvas id="cmg"></canvas>
				<canvas id="cfg"></canvas>
			</div>
		</div>
		<div class="arcade-hint-bar">
			<b>WASD / 方向键</b> 移动战机 · <b>鼠标瞄准左键</b> 射击 · <b>F</b> 自动射击 · <b>P</b> 暂停 · <b>M</b> 静音
		</div>
		<script>var $ = {};</script>
		<script src="js/jsfxr.js"></script>
		<script src="js/util.js"></script>
		<script src="js/storage.js"></script>
		<script src="js/definitions.js"></script>
		<script src="js/audio.js"></script>
		<script src="js/text.js"></script>
		<script src="js/hero.js"></script>
		<script src="js/enemy.js"></script>
		<script src="js/bullet.js"></script>
		<script src="js/explosion.js"></script>
		<script src="js/powerup.js"></script>
		<script src="js/particle.js"></script>
		<script src="js/particleemitter.js"></script>
		<script src="js/textpop.js"></script>
		<script src="js/levelpop.js"></script>
		<script src="js/button.js"></script>
		<script src="js/game.js"></script>
		<script src="../assets/arcade-nav.js" data-home="../index.html" data-pos="top-left" data-game-id="星际突围/index.html"></script>
	</body>
</html>
