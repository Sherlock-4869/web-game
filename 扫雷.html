<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫雷</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e9f2ff;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.back{padding:9px 14px;border:1px solid #304968;border-radius:10px;background:#0e2036}.panel{background:#0d1d31;border:1px solid #24405f;border-radius:18px;padding:20px;box-shadow:0 16px 45px #0004}button{font:inherit;color:inherit;background:#163452;border:1px solid #38618a;border-radius:9px;padding:9px 14px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#94acc7}.score{font-size:18px;color:#7de2ff}canvas{display:block;max-width:100%;margin:auto;background:#06101c;border-radius:12px;border:1px solid #284665}.memory{display:grid;grid-template-columns:repeat(4,72px);gap:10px;justify-content:center}.memory button{height:72px;font-size:30px;padding:0}.mine{display:grid;grid-template-columns:repeat(9,34px);gap:3px;justify-content:center}.mine button{width:34px;height:34px;padding:0;font-size:14px}@media(max-width:600px){.wrap{padding:16px}.memory{grid-template-columns:repeat(4,60px)}.memory button{height:60px}.mine{grid-template-columns:repeat(9,28px)}.mine button{width:28px;height:28px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">🎮 像素游乐场</a><a class="back" href="index.html">← 返回大厅</a></header><section class="panel"><h1>💣 扫雷</h1><p class="muted">点击方块，找出所有安全区域。</p><div id="g" class="mine"></div><div class="actions"><button onclick="newG()">新游戏</button></div></section></main><script>let m,revealed,dead=false;function newG(){m=Array(81).fill(0);revealed=[];dead=false;let q=[...Array(81).keys()].sort(()=>Math.random()-.5).slice(0,10);q.forEach(i=>m[i]=-1);for(let i=0;i<81;i++)if(m[i]>=0){let x=i%9,y=i/9|0;m[i]=[-1,0,1].reduce((n,dy)=>n+[-1,0,1].filter(dx=>{let X=x+dx,Y=y+dy;return X>=0&&X<9&&Y>=0&&Y<9&&m[Y*9+X]===-1}).length,0)}draw()}function draw(){g.innerHTML=m.map((v,i)=>`<button onclick="openC(${i})">${revealed.includes(i)?(v<0?'💣':v||''):'■'}</button>`).join('')}function openC(i){if(dead||revealed.includes(i))return;if(m[i]<0){dead=true;revealed=m.map((v,j)=>v<0?j:-1).filter(j=>j>=0);draw();setTimeout(()=>alert('踩到地雷了！'),30);return}revealed.push(i);if(m[i]===0){let x=i%9,y=i/9|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let X=x+dx,Y=y+dy;if(X>=0&&X<9&&Y>=0&&Y<9){let j=Y*9+X;if(!revealed.includes(j)&&m[j]>=0)openC(j)}}}draw();if(revealed.length===71)setTimeout(()=>alert('扫雷成功！'),30)}newG();</script></body></html>
